# Format, lint, typecheck, audit and Rust checks on the greg-zone Woodpecker
# instance: one shared `bun install`, then the JS checks fan out in parallel
# while the Rust checks run in their own image and start immediately. The
# desktop-macos Tauri bundle build stays in .github/workflows/, since a Linux
# Docker backend cannot produce a macOS .app.
#
# Step images build locally on the CI host under greg-zone/ci/:
# `greg-zone/bun-git` (oven/bun plus git, for the JS steps) and
# `greg-zone/gdex-rust` (rust 1.95.0 with rustfmt, clippy and the Tauri Linux
# libraries, for the Rust steps). If every step fails pulling an image, rebuild
# it there — instructions live in each Dockerfile.
when:
  - event: pull_request
  - event: push
    branch: main

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      # fallow diffs against a merge base, which a partial clone lacks.
      partial: false

steps:
  - name: install
    image: greg-zone/bun-git:1.3.14
    commands:
      - bun install --frozen-lockfile

  - name: fmt
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run fmt:check

  - name: lint
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run lint:ci

  - name: comment-fmt
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run comment-fmt:check

  - name: typecheck
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    commands:
      - bun run typecheck

  # PR pipelines run on GitHub's merge ref, so `HEAD^1` is the base branch tip —
  # a merge base with no `git fetch`, which matters because only the clone step
  # holds forge credentials. PR-only: on a `main` push there is no base to diff
  # against.
  - name: fallow
    image: greg-zone/bun-git:1.3.14
    depends_on: [install]
    when:
      - event: pull_request
    commands:
      - bun run fallow:audit -- --base 'HEAD^1'

  # The Rust checks run cargo directly in the rust image (the bun scripts are
  # thin wrappers and this image has no bun); they need no dependencies, so they
  # start immediately.
  - name: rust-fmt
    image: greg-zone/gdex-rust:1.95.0
    depends_on: []
    commands:
      # same command as `bun run fmt:rust:check`
      - cargo fmt --manifest-path src-tauri/Cargo.toml --check

  - name: rust-clippy
    image: greg-zone/gdex-rust:1.95.0
    depends_on: []
    commands:
      # same command as `bun run clippy`
      - cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
